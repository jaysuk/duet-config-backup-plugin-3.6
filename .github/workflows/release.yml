name: Release

# Builds the installable plugin ZIP against a real DuetWebControl 3.6 checkout and creates a GitHub
# Release for it - no local build.bat run needed. Just push a version tag:
#
#   (bump plugin.json's "version") then:
#   git tag v1.2.3 && git push origin v1.2.3
#
# This repo intentionally has no package.json (see README's "Building" section) - DWC's own
# build-plugin script does the compiling, and this workflow does what that section documents as a
# manual step: `npm install --save-dev dwc-config-backup-core` into the DWC checkout before building.
# Bump CORE_VERSION below whenever dwc-config-backup-core is upgraded (same version you'd otherwise
# type by hand into that install command).
#
# You can also run it manually (Actions -> Release -> Run workflow) to build a ZIP as an artifact,
# optionally against a different DWC ref.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dwc-ref:
        description: DuetWebControl branch/tag/sha to build against
        default: v3.6-dev

permissions:
  contents: write # create the Release and upload the asset

env:
  # Pin the dwc-config-backup-core version this plugin builds against. Bump alongside any dependency
  # update - there's no package.json here for a workflow step to read this from automatically.
  CORE_VERSION: 0.1.13
  # The Conventional-Commit changelog generator is shared across the Duet plugin family and lives in
  # the runtime repo (single source of truth). Pinned to a ref; bump this one line to adopt changelog
  # format changes. Source: jaysuk/dwc-plugin-runtime → scripts/changelog.mjs.
  RUNTIME_REF: d077f81a11bb5af9a35fe39f7b82d789eab19896

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin
          fetch-depth: 0 # full history + tags so the changelog generator can find the previous tag
          fetch-tags: true

      - name: Checkout DuetWebControl
        uses: actions/checkout@v6
        with:
          repository: Duet3D/DuetWebControl
          ref: ${{ github.event.inputs.dwc-ref || 'v3.6-dev' }}
          path: DuetWebControl

      # Record exactly which DWC the ZIP is built against, for the release notes.
      - name: Capture DuetWebControl build info
        id: dwc
        run: |
          echo "version=$(node -p "require('./DuetWebControl/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C DuetWebControl rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "ref=${{ github.event.inputs.dwc-ref || 'v3.6-dev' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with: { node-version: 20 }

      # The tag must match the version stamped into the ZIP/manifest, so a release can't ship a
      # mismatched build.
      - name: Verify tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: plugin
        run: |
          VER=$(node -p "require('./plugin.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VER" != "$TAG" ]; then
            echo "::error::Tag '$TAG' != plugin.json version '$VER'. Bump plugin.json and re-tag."
            exit 1
          fi

      - name: Install DuetWebControl
        working-directory: DuetWebControl
        run: npm install

      # DWC's build-plugin script does not install a plugin's own dependencies (see this repo's
      # README) - install the pinned dwc-config-backup-core straight into DWC's node_modules.
      - name: Install dwc-config-backup-core into DuetWebControl
        working-directory: DuetWebControl
        run: npm install --save-dev "dwc-config-backup-core@${CORE_VERSION}"

      - name: Build installable ZIP
        working-directory: DuetWebControl
        run: npm run build-plugin -- "${{ github.workspace }}/plugin"

      - name: Move ZIP into plugin checkout
        run: |
          ZIP=$(ls DuetWebControl/dist/DuetConfigBackup-*.zip | head -n1)
          if [ -z "$ZIP" ]; then
            echo "::error::No ZIP produced by build-plugin"
            exit 1
          fi
          mv "$ZIP" plugin/

      # Release body = Conventional-Commit changelog + a footer with install instructions, the DWC
      # version built against, and the dwc-config-backup-core version used. Fetch the shared
      # changelog generator from the runtime repo (single source of truth, pinned ref).
      - name: Fetch shared release-notes generator
        if: startsWith(github.ref, 'refs/tags/')
        run: curl -fsSL "https://raw.githubusercontent.com/jaysuk/dwc-plugin-runtime/${RUNTIME_REF}/scripts/changelog.mjs" -o "$RUNNER_TEMP/changelog.mjs"

      - name: Generate release notes
        id: changelog
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: plugin
        env:
          DWC_VERSION: ${{ steps.dwc.outputs.version }}
          DWC_SHA: ${{ steps.dwc.outputs.sha }}
          DWC_REF: ${{ steps.dwc.outputs.ref }}
        run: |
          {
            echo 'body<<__CHANGELOG_EOF__'
            node "$RUNNER_TEMP/changelog.mjs"
            echo
            node scripts/release-footer.mjs
            echo
            echo '__CHANGELOG_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Publish Release with the ZIP (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          body: ${{ steps.changelog.outputs.body }}
          files: plugin/DuetConfigBackup-*.zip

      - name: Upload ZIP as an artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: DuetConfigBackup-3.6-plugin
          path: plugin/DuetConfigBackup-*.zip
