name: Release

# Builds the installable plugin ZIP against a real DuetWebControl 3.6 checkout and creates a GitHub
# Release for it - no local build.bat run needed. Cut a release:
#
#   node scripts/release.mjs 1.3.1 --push    # drafts release notes, bumps plugin.json, commits, tags, pushes
#
# This repo intentionally has no package.json (see README's "Building" section) - DWC's own
# build-plugin script does the compiling, and this workflow does what that section documents as a
# manual step: `npm install --save-dev dwc-config-backup-core` into the DWC checkout before building.
# Bump CORE_VERSION below whenever dwc-config-backup-core is upgraded (same version you'd otherwise
# type by hand into that install command).
#
# Because there is no package.json it cannot use the shared release workflow as a whole
# (jaysuk/dwc-plugin-workflows), but it uses the shared title, notes and footer scripts from it, so
# releases look the same as every other plugin's.
#
# You can also run it manually (Actions -> Release -> Run workflow) for a dry run: it builds the ZIP as an
# artifact, optionally against a different DWC ref, and shows the title and notes in the run summary
# without publishing anything.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dwc-ref:
        description: DuetWebControl branch/tag/sha to build against
        default: v3.6-dev

permissions:
  contents: write # create the Release and upload the asset

env:
  # Pin the dwc-config-backup-core version this plugin builds against. Bump alongside any dependency
  # update - there's no package.json here for a workflow step to read this from automatically.
  CORE_VERSION: 0.1.13
  DWC_REF: ${{ inputs.dwc-ref || 'v3.6-dev' }}
  # Ref of jaysuk/dwc-plugin-workflows to take the shared scripts from.
  WORKFLOWS_REF: v1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin
          fetch-depth: 0 # full history + tags so the changelog generator and title picker see every tag
          fetch-tags: true

      - name: Checkout shared release scripts
        uses: actions/checkout@v6
        with:
          repository: jaysuk/dwc-plugin-workflows
          ref: ${{ env.WORKFLOWS_REF }}
          path: workflows

      - name: Checkout DuetWebControl
        uses: actions/checkout@v6
        with:
          repository: Duet3D/DuetWebControl
          ref: ${{ env.DWC_REF }}
          path: DuetWebControl

      # Record exactly which DWC the ZIP is built against, for the release notes.
      - name: Capture DuetWebControl build info
        id: dwc
        run: |
          echo "version=$(node -p "require('./DuetWebControl/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C DuetWebControl rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with: { node-version: 26 }

      # The tag must match the version stamped into the ZIP/manifest, so a release can't ship a
      # mismatched build.
      - name: Verify tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: plugin
        run: |
          VER=$(node -p "require('./plugin.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VER" != "$TAG" ]; then
            echo "::error::Tag '$TAG' != plugin.json version '$VER'. Bump plugin.json and re-tag."
            exit 1
          fi

      - name: Install DuetWebControl
        working-directory: DuetWebControl
        run: npm install

      # DWC's build-plugin script does not install a plugin's own dependencies (see this repo's
      # README) - install the pinned dwc-config-backup-core straight into DWC's node_modules.
      - name: Install dwc-config-backup-core into DuetWebControl
        working-directory: DuetWebControl
        run: npm install --save-dev "dwc-config-backup-core@${CORE_VERSION}"

      - name: Build installable ZIP
        working-directory: DuetWebControl
        run: npm run build-plugin -- "${{ github.workspace }}/plugin"

      - name: Move ZIP into plugin checkout
        run: |
          ZIP=$(ls DuetWebControl/dist/DuetConfigBackup-*.zip | grep -v -- '-srcmap\.zip$' | head -n1)
          if [ -z "$ZIP" ]; then
            echo "::error::No ZIP produced by build-plugin"
            exit 1
          fi
          mv "$ZIP" plugin/

      # The core version only exists in this workflow, so add it to the footer notes at run time (the
      # file is not committed). The shared footer script appends .github/release-footer.md verbatim.
      - name: Add the core version to the footer notes
        working-directory: plugin
        run: |
          mkdir -p .github
          echo "> 🧩 Built with dwc-config-backup-core \`${CORE_VERSION}\`." >> .github/release-footer.md

      # Notes and title are generated on manual runs too (shown in the run summary) so a dry run
      # exercises exactly what a tag push will publish.
      - name: Generate release notes
        id: meta
        working-directory: plugin
        env:
          DWC_VERSION: ${{ steps.dwc.outputs.version }}
          DWC_SHA: ${{ steps.dwc.outputs.sha }}
        run: |
          VER=$(node -p "require('./plugin.json').version")
          node ../workflows/scripts/release-notes.mjs --version "v$VER" > "$RUNNER_TEMP/release-notes.md"
          echo "title=$(node ../workflows/scripts/release-title.mjs "v$VER")" >> "$GITHUB_OUTPUT"

      - name: Show what would be released (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "## ${{ steps.meta.outputs.title }}"
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Release with the ZIP (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          name: ${{ steps.meta.outputs.title }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: plugin/DuetConfigBackup-*.zip

      - name: Upload ZIP as an artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: DuetConfigBackup-3.6-plugin
          path: plugin/DuetConfigBackup-*.zip
